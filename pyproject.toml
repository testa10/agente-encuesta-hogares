[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "encuesta-hogares-agente"
version = "0.1.0"
description = "Agente y paquete reutilizable para analizar la penetracion tecnologica (TV cable, internet, PC, streaming) en hogares de Montevideo, a partir de la Encuesta Continua de Hogares (ECH, INE Uruguay), para cualquier año de datos disponible."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "pyreadstat>=1.2",
    "plotly>=5.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "kaleido>=0.2",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
