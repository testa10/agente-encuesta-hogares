name: Tests

# Corre los tests en cada push y pull request contra main, para que un
# cambio roto nunca llegue a main sin que alguien lo note primero.
# No depende de datos reales del INE (data/ va vacio en un clone limpio,
# ver .gitignore) - los 65 tests usan solo dataframes sinteticos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Correr tests
        run: pytest -q
